name: Command Desk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use a canonical isolated temporary directory
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'command-desk-tests'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $canonical = node -e "console.log(require('node:fs').realpathSync.native(process.argv[1]))" "$folder"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:selection
      - run: npm run test:controls
      - run: npm audit --omit=dev --audit-level=high
