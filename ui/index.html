<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
		<title>Command Desk</title>
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="builder.css">
		<link rel="stylesheet" href="controls.css">
		<link rel="stylesheet" href="taskbar.css">
		<script src="taskbar.js" defer></script>
	</head>
	<body>
		<header>
			<div class="brand">
				<img src="../assets/icon.png" alt="" width="30" height="30">
				<strong>Command Desk</strong>
				<span class="version"></span>
			</div>
			<div class="tools">
				<span id="status"></span>
				<button id="theme" class="icon"></button>
				<select id="language" aria-label="Language">
					<option value="ru">Русский</option>
					<option value="uk">Українська</option>
					<option value="en">English</option>
				</select>
				<button id="tray" class="icon"></button>
			</div>
		</header>
		<nav id="nav" class="b-navigation"></nav>
		<div id="audience-notice" role="status" hidden>
			<span></span>
			<button data-view="connection"></button>
		</div>
		<main id="main"></main>
		<div id="toast" role="status" hidden></div>
		<script src="../assets/lucide.js"></script>
		<script src="i18n.js"></script>
		<script src="builder-i18n.js"></script>
		<script src="reliability.js"></script>
		<script src="builder.js"></script>
		<script src="controls.js"></script>
		<script src="app.js"></script>
	</body>
</html>
